<div class="hero-banner">
  <img src="{{ '/assets/imgs/qub.jpg' | relative_url }}" alt="Queen's University Belfast">

  <div class="hero-overlay">
    <div class="hero-logo-wrap">
    </div>
    <div class="hero-text">
      <div class="hero-course-code">{{ site.course_code }}</div>
      <div class="hero-course-name">{{ site.course_name }}</div>
      <div class="hero-subtitle">{{ site.university }} &mdash; {{ site.semester }}</div>
    </div>
    <div class="hero-spacer"></div>
  </div>
</div>
